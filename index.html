<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNTN - Hiking Guide</title>
    <meta name="description" content="A modern hiking guide website to help outdoor enthusiasts prepare for mountain adventures.">
    <script>
        // Get the repository name from the path
        const pathParts = window.location.pathname.split('/').filter(part => part);
        const repoName = pathParts[0] || '';
        
        // Redirect to the appropriate path
        if (repoName && repoName !== 'mntn-landing') {
            window.location.href = '/' + repoName + '/';
        } else {
            window.location.href = '/mntn-landing/';
        }
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; background-color: #0b1d26; color: #fff;">
        <div style="text-align: center;">
            <h1 style="color: #fbd784; margin-bottom: 20px;">MNTN - Hiking Guide</h1>
            <p>Loading your adventure...</p>
            <p style="margin-top: 20px; font-size: 14px; opacity: 0.7;">If you're not redirected automatically, <a href="/mntn-landing/" style="color: #fbd784;">click here</a></p>
        </div>
    </div>
</body>
</html>
